buildscript {
    dependencies {
        classpath 'com.github.dexman545:Outlet:1.6.1'
    }
}
plugins {
    id "net.fabricmc.fabric-loom" version "1.15-SNAPSHOT"
    id 'maven-publish'
    id 'com.modrinth.minotaur' version '2.+'
    id 'org.ajoberstar.reckon' version '0.13.1'
}
apply plugin: 'io.github.dexman545.outlet'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

group = project.group
description = project.displayname

base {
    archivesName = project.name
}

loom {
    accessWidenerPath = file('src/main/resources/kirin.aw')
}

reckon {
    scopeFromProp()
    stageFromProp('beta', 'rc', 'final')
}

outlet {
    allowSnapshotsForProject = true
    mcVersionRange = project.minecraft_version_range
}

System.out.println "Outlet MC Versions: ${outlet.mcVersions()}"

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    api "net.fabricmc:fabric-loader:${project.loader_version}"

    api fabricApi.module("fabric-api-base", project.fabric_version)
    api fabricApi.module("fabric-lifecycle-events-v1", project.fabric_version)
    api fabricApi.module("fabric-key-mapping-api-v1", project.fabric_version)
    api fabricApi.module("fabric-rendering-v1", project.fabric_version)
    api fabricApi.module("fabric-transitive-access-wideners-v1", project.fabric_version)
}

processResources {
    inputs.property "version", project.version.toString()

    filesMatching("fabric.mod.json") {
        expand "version": project.version.toString(),
                "minecraftVersion": project.minecraft_version_range,
                "loaderVersion": ">=${project.loader_version}",
                "fabricVersion": ">=${project.fabric_version}"
    }

    from 'LICENSE'
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}
tasks.modrinth {
    onlyIf {
      def stage = version.version.stage.value
      (stage == null || stage.name != 'beta')
    }
}

modrinth {
    token = System.env.MODRINTH_KEY
    projectId = project.modrinth_project_id
    //featured = true
    versionNumber = version.toString()
    versionName = project.name + '-' + version
    changelog = "[Changelog](https://github.com/MineLittlePony/Kirin/releases/tag/${version.toString()})"
    loaders = ['fabric', 'quilt']
    uploadFile = jar
    outlet.mcVersions().each{ver ->
      gameVersions.add ver
    }
    dependencies {
       required.project 'P7dR8mSH'
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java

            pom {
                name = "Kirin"
                description = "Common code for MineLP mods"
                url = "https://minelittlepony-mod.com"
                licenses {
                    license {
                        name = "MIT Public License"
                        url = "https://tlo.mit.edu/learn-about-intellectual-property/software-and-open-source-licensing"
                    }
                }
                developers {
                    developer {
                        id = "sollace"
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/MineLittlePony/Kirin.git'
                    developerConnection = 'scm:git:ssh://github.com/MineLittlePony/Kirin.git'
                    url = 'https://github.com/MineLittlePony/Kirin'
                }
            }
        }
    }

    repositories {
        maven {
            name = "MineLittlePony"
            def stage = version.version.stage.value
            url = "s3://repo.minelittlepony-mod.com/maven/${stage != null && (stage.name == 'beta' || stage.name == 'unobf') ? 'snapshot' : 'release'}"
            credentials(AwsCredentials) {
                accessKey = System.env.ACCESS_KEY
                secretKey = System.env.SECRET_KEY
            }
        }
    }
}
